{% extends "base.html" %}

{% block content %}
<style>
    /* Метрики */
    .metrics-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
    }

    .metric-widget {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .metric-widget:hover {
        transform: translateY(-2px);
        border-color: rgba(139, 92, 246, 0.4);
    }

    .metric-title {
        color: var(--text-secondary);
        font-size: 0.85rem;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .metric-value {
        font-size: 2rem;
        font-weight: 700;
        color: var(--text-primary);
        font-family: 'Outfit', sans-serif;
    }

    .metric-sub {
        font-size: 0.8rem;
        color: var(--text-secondary);
    }

    /* Карточки параметров */
    .params-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
        gap: 20px;
        margin-bottom: 40px;
    }

    .param-card {
        background: linear-gradient(145deg, var(--bg-card), rgba(17, 24, 39, 0.9));
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 15px;
        position: relative;
        overflow: hidden;
    }

    .param-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 4px;
        height: 100%;
        background: linear-gradient(to bottom, #3b82f6, #8b5cf6);
    }

    .param-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        padding-bottom: 10px;
    }

    .param-agent {
        font-weight: 600;
        font-size: 1.1rem;
        color: #fff;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .param-agent-badge {
        padding: 4px 8px;
        border-radius: 6px;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
    }

    .badge-scout { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }
    .badge-swing { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .badge-shadow { background: rgba(139, 92, 246, 0.2); color: #a78bfa; }

    .param-date {
        font-size: 0.8rem;
        color: var(--text-secondary);
    }

    .param-reason {
        background: rgba(0, 0, 0, 0.2);
        padding: 12px;
        border-radius: 8px;
        font-size: 0.9rem;
        color: #e5e7eb;
        border-left: 2px solid #8b5cf6;
        line-height: 1.4;
    }

    .param-reason-label {
        display: block;
        font-size: 0.75rem;
        color: var(--text-secondary);
        margin-bottom: 4px;
        text-transform: uppercase;
    }

    .param-diff {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 5px;
    }

    .diff-box {
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        padding: 10px;
        font-family: monospace;
        font-size: 0.85rem;
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 150px;
        overflow-y: auto;
    }

    .diff-old {
        border-left: 2px solid #ef4444;
        color: #fca5a5;
    }

    .diff-new {
        border-left: 2px solid #10b981;
        color: #6ee7b7;
    }

    .param-actions {
        display: flex;
        gap: 10px;
        margin-top: auto;
        padding-top: 15px;
    }

    .btn-approve, .btn-reject {
        flex: 1;
        padding: 10px;
        border: none;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }

    .btn-approve {
        background: rgba(16, 185, 129, 0.15);
        color: #34d399;
        border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .btn-approve:hover {
        background: rgba(16, 185, 129, 0.25);
    }

    .btn-reject {
        background: rgba(239, 68, 68, 0.15);
        color: #f87171;
        border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .btn-reject:hover {
        background: rgba(239, 68, 68, 0.25);
    }

    /* Таблицы (для истории и overlays) */
    .table-container {
        overflow-x: auto;
        background: var(--bg-card);
        border-radius: 12px;
        border: 1px solid var(--border-color);
        margin-bottom: 40px;
    }

    .data-table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
    }

    .data-table th, .data-table td {
        padding: 12px 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .data-table th {
        color: var(--text-secondary);
        font-weight: 500;
        font-size: 0.85rem;
        background: rgba(0, 0, 0, 0.2);
    }

    .data-table tr:last-child td {
        border-bottom: none;
    }

    .data-table tbody tr:hover {
        background: rgba(255, 255, 255, 0.02);
    }

    .section-title {
        font-size: 1.25rem;
        font-family: 'Outfit', sans-serif;
        font-weight: 600;
        margin-bottom: 15px;
        color: #fff;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .empty-state {
        padding: 40px;
        text-align: center;
        color: var(--text-secondary);
        background: var(--bg-card);
        border: 1px dashed var(--border-color);
        border-radius: 12px;
        margin-bottom: 40px;
    }
</style>

<div>
    <!-- Ключевые метрики из последнего запуска -->
    <div class="section-title">
        <svg style="width:20px;height:20px;fill:none;stroke:#8b5cf6;stroke-width:2;" viewBox="0 0 24 24"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path></svg>
        Последняя калибровка
    </div>
    <div class="metrics-grid" id="metrics-container">
        <!-- Заполняется через JS -->
        <div class="metric-widget"><div class="metric-title">Загрузка...</div></div>
    </div>

    <!-- Ожидающие утверждения параметры -->
    <div class="section-title" style="margin-top: 10px;">
        <svg style="width:20px;height:20px;fill:none;stroke:#3b82f6;stroke-width:2;" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16c0 1.1.9 2 2 2h12a2 2 0 0 0 2-2V8l-6-6z"></path><path d="M14 3v5h5M16 13H8M16 17H8M10 9H8"></path></svg>
        Предложения NEXUS
        <span id="pending-count" style="background:#3b82f6;color:white;font-size:0.8rem;padding:2px 8px;border-radius:10px;margin-left:10px;display:none;">0</span>
    </div>
    <div id="pending-container" class="params-grid">
        <!-- Заполняется через JS -->
        <div class="empty-state">Нет ожидающих предложений</div>
    </div>

    <!-- История запусков -->
    <div class="section-title">
        <svg style="width:20px;height:20px;fill:none;stroke:#10b981;stroke-width:2;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        История калибровок
    </div>
    <div class="table-container">
        <table class="data-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Дата и время</th>
                    <th>Триггер</th>
                    <th>Окно (дней)</th>
                    <th>Сигналов</th>
                    <th>Статус</th>
                    <th>Предложено</th>
                </tr>
            </thead>
            <tbody id="runs-table-body">
                <!-- Заполняется через JS -->
            </tbody>
        </table>
    </div>

    <!-- Текущие Overlay -->
    <div class="section-title">
        <svg style="width:20px;height:20px;fill:none;stroke:#f59e0b;stroke-width:2;" viewBox="0 0 24 24"><path d="M2 12h4l2-9 5 18 2-9h5"></path></svg>
        Текущие Overlay Промпты
    </div>
    <div class="params-grid" id="overlays-container">
        <!-- Заполняется через JS -->
    </div>
</div>

<script>
    // Обновление заголовка в сайдбаре
    document.getElementById('page-title').textContent = "Калибровка Агентов (NEXUS)";
    document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
    document.getElementById('nav-calibration').classList.add('active');

    async function loadData() {
        try {
            const [runsRes, pendingRes, overlaysRes] = await Promise.all([
                fetchJSON('/api/calibration/runs'),
                fetchJSON('/api/calibration/pending'),
                fetchJSON('/api/calibration/overlays')
            ]);
            
            renderMetricsAndRuns(runsRes);
            renderPendingParams(pendingRes);
            renderOverlays(overlaysRes);
        } catch (e) {
            console.error("Ошибка загрузки данных", e);
            showToast("Ошибка загрузки данных калибровки", "error");
        }
    }

    function renderMetricsAndRuns(runs) {
        const tbody = document.getElementById('runs-table-body');
        tbody.innerHTML = '';
        
        if (!runs || runs.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-secondary);">Нет данных</td></tr>';
            document.getElementById('metrics-container').innerHTML = '<div class="empty-state" style="grid-column: 1/-1;">Нет данных о калибровке</div>';
            return;
        }

        // Рендерим историю
        runs.forEach(r => {
            const tr = document.createElement('tr');
            
            let statusColor = "var(--text-secondary)";
            if (r.status === "completed") statusColor = "#10b981";
            else if (r.status === "failed") statusColor = "#ef4444";
            
            tr.innerHTML = `
                <td>#${r.id}</td>
                <td>${formatDate(r.run_at)}</td>
                <td><span style="background:rgba(255,255,255,0.1);padding:2px 6px;border-radius:4px;font-size:0.8rem;">${r.trigger_type}</span></td>
                <td>${r.window_days}</td>
                <td>${r.signals_analyzed}</td>
                <td style="color:${statusColor};">${r.status}</td>
                <td>${r.params_proposed || 0}</td>
            `;
            tbody.appendChild(tr);
        });

        // Рендерим метрики последнего успешного запуска
        const lastRun = runs.find(r => r.metrics_json && (r.status === 'completed' || r.status === 'skipped_low_data'));
        const container = document.getElementById('metrics-container');
        
        if (lastRun && lastRun.metrics_json) {
            try {
                const m = JSON.parse(lastRun.metrics_json);
                const brierObj = m.brier_score || {};
                const funnelObj = m.funnel || {};
                const wrScout = m.win_rate && m.win_rate.scout ? m.win_rate.scout.win_rate : null;
                const pnlScout = m.pnl && m.pnl.scout ? m.pnl.scout : null;

                let brierColor = "var(--text-primary)";
                if (brierObj.brier_score !== undefined && brierObj.brier_score !== null) {
                    const bs = brierObj.brier_score;
                    if (bs < 0.15) brierColor = "#10b981";
                    else if (bs > 0.25) brierColor = "#ef4444";
                }

                let html = `
                    <div class="metric-widget">
                        <div class="metric-title">Brier Score</div>
                        <div class="metric-value" style="color:${brierColor}">${formatBrier(brierObj.brier_score)}</div>
                        <div class="metric-sub">Основано на ${brierObj.samples || 0} исходах</div>
                    </div>
                    <div class="metric-widget">
                        <div class="metric-title">Win Rate (SCOUT)</div>
                        <div class="metric-value">${wrScout !== null ? wrScout.toFixed(1) + '%' : '—'}</div>
                        <div class="metric-sub">Точность предиктов</div>
                    </div>
                    <div class="metric-widget">
                        <div class="metric-title">Анализировано</div>
                        <div class="metric-value">${funnelObj.total_analyzed || 0}</div>
                        <div class="metric-sub">За ${lastRun.window_days} дней</div>
                    </div>
                    <div class="metric-widget">
                        <div class="metric-title">PnL (SCOUT)</div>
                        <div class="metric-value">${formatPnL(pnlScout)}</div>
                        <div class="metric-sub">Реализованный</div>
                    </div>
                `;
                container.innerHTML = html;
            } catch (e) {
                console.error("Ошибка парсинга metrics_json", e);
                container.innerHTML = '<div class="empty-state" style="grid-column: 1/-1;">Ошибка формата данных</div>';
            }
        } else {
            container.innerHTML = '<div class="empty-state" style="grid-column: 1/-1;">Нет метрик для отображения</div>';
        }
    }

    function renderPendingParams(pending) {
        const container = document.getElementById('pending-container');
        const countSpan = document.getElementById('pending-count');
        
        if (!pending || pending.length === 0) {
            container.innerHTML = '<div class="empty-state" style="grid-column: 1/-1;">Нет ожидающих предложений от NEXUS</div>';
            countSpan.style.display = 'none';
            return;
        }

        countSpan.textContent = pending.length;
        countSpan.style.display = 'inline-block';
        container.innerHTML = '';

        pending.forEach(p => {
            const strategy = p.strategy_type.toUpperCase();
            const badgeClass = `badge-${strategy.toLowerCase()}`;
            
            const card = document.createElement('div');
            card.className = 'param-card';
            
            let diffHtml = '';
            // Если это overlay, показываем старое и новое
            if (p.param_name === 'overlay_prompt') {
                diffHtml = `
                    <div class="param-diff">
                        <div>
                            <span style="font-size:0.75rem;color:var(--text-secondary);">Текущий:</span>
                            <div class="diff-box diff-old">${p.previous_value ? escapeHTML(p.previous_value) : '<i>(пусто)</i>'}</div>
                        </div>
                        <div>
                            <span style="font-size:0.75rem;color:var(--text-secondary);">Предлагаемый:</span>
                            <div class="diff-box diff-new">${escapeHTML(p.param_value)}</div>
                        </div>
                    </div>
                `;
            } else {
                diffHtml = `
                    <div style="display:flex;align-items:center;gap:10px;margin-top:10px;">
                        <span style="color:#fca5a5;text-decoration:line-through;">${p.previous_value}</span>
                        <svg style="width:16px;height:16px;fill:none;stroke:var(--text-secondary);" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"></path></svg>
                        <span style="color:#6ee7b7;font-weight:bold;">${p.param_value}</span>
                    </div>
                `;
            }

            card.innerHTML = `
                <div class="param-header">
                    <div class="param-agent">
                        <span class="param-agent-badge ${badgeClass}">${strategy}</span>
                        ${p.param_name}
                    </div>
                    <div class="param-date">${formatDate(p.updated_at)}</div>
                </div>
                
                <div class="param-reason">
                    <span class="param-reason-label">Обоснование NEXUS:</span>
                    ${escapeHTML(p.reason || 'Нет описания')}
                </div>
                
                ${diffHtml}
                
                <div class="param-actions">
                    <button class="btn-approve" onclick="approveParam(${p.id})">
                        <svg style="width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"></path></svg>
                        Принять
                    </button>
                    <button class="btn-reject" onclick="rejectParam(${p.id})">
                        <svg style="width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        Отклонить
                    </button>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function renderOverlays(overlays) {
        const container = document.getElementById('overlays-container');
        container.innerHTML = '';
        
        if (!overlays) return;

        ['SCOUT', 'SWING', 'SHADOW'].forEach(strategy => {
            const badgeClass = `badge-${strategy.toLowerCase()}`;
            const val = overlays[strategy];
            
            const card = document.createElement('div');
            card.className = 'param-card';
            card.style.background = 'var(--bg-card)';
            card.style.borderColor = 'rgba(255,255,255,0.05)';
            
            card.innerHTML = `
                <div class="param-header">
                    <div class="param-agent">
                        <span class="param-agent-badge ${badgeClass}">${strategy}</span>
                    </div>
                </div>
                <div class="diff-box" style="border: 1px solid rgba(255,255,255,0.1); color: var(--text-primary); margin-top: 10px; flex-grow: 1;">
                    ${val ? escapeHTML(val) : '<i style="color:var(--text-secondary)">Нет активного overlay</i>'}
                </div>
            `;
            container.appendChild(card);
        });
    }

    async function approveParam(id) {
        try {
            const res = await fetch('/api/calibration/approve', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({id: id})
            });
            if (res.ok) {
                showToast("Параметр утверждён", "success");
                loadData();
            } else {
                showToast("Ошибка сервера", "error");
            }
        } catch(e) {
            showToast("Сетевая ошибка", "error");
        }
    }

    async function rejectParam(id) {
        if (!confirm('Отклонить это предложение?')) return;
        try {
            const res = await fetch('/api/calibration/reject', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({id: id})
            });
            if (res.ok) {
                showToast("Предложение отклонено", "success");
                loadData();
            } else {
                showToast("Ошибка сервера", "error");
            }
        } catch(e) {
            showToast("Сетевая ошибка", "error");
        }
    }

    function escapeHTML(str) {
        if (!str) return '';
        return str.replace(/[&<>'"]/g, 
            tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag] || tag)
        );
    }

    registerRefresh(loadData);
    loadData();
</script>
{% endblock %}
